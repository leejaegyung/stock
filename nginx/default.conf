server {
    listen 80;
    server_name _;

    location /static/ {
        alias /srv/static/;
        expires 1h;
    }

    location / {
        proxy_pass         http://app:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }
}
