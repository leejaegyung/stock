repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: architecture-boundary
        name: Architecture Layer Boundary Check
        entry: pytest tests/test_architecture.py -v
        language: system
        pass_filenames: false
        always_run: true
