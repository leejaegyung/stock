[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "stock-analyst"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Layer 1: formulas must not import app modules — enforced by test_architecture.py
"app/core/formulas.py" = []
# Layer 2: db may only import config
"app/db/*.py" = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = ["live: requires real API keys (deselect with -m 'not live')"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
ignore_missing_imports = true
